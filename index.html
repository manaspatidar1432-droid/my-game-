<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Battle Zone - Shooting Game</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,sans-serif;
}

#game{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#4b793d;
}

/* MAP */

#world{
    position:absolute;
    width:2400px;
    height:1800px;
    left:-600px;
    top:-400px;
    background:
        radial-gradient(circle at 20% 20%,#719b4b 0 90px,transparent 92px),
        radial-gradient(circle at 70% 30%,#6c9347 0 120px,transparent 122px),
        radial-gradient(circle at 30% 75%,#739b4c 0 130px,transparent 132px),
        radial-gradient(circle at 80% 75%,#709749 0 100px,transparent 102px),
        #557f3f;
}

/* Roads */

.road{
    position:absolute;
    background:#4a4a43;
}

.road1{
    width:100%;
    height:100px;
    top:750px;
    left:0;
}

.road2{
    width:100px;
    height:100%;
    left:1050px;
    top:0;
}

.road3{
    width:900px;
    height:75px;
    left:200px;
    top:300px;
    transform:rotate(25deg);
}

/* Buildings */

.building{
    position:absolute;
    width:150px;
    height:110px;
    background:#777;
    border:6px solid #454545;
    box-shadow:0 8px 0 #333;
}

.building:after{
    content:"";
    position:absolute;
    width:35px;
    height:35px;
    background:#b9d7df;
    left:25px;
    top:25px;
    box-shadow:70px 0 #b9d7df;
}

.b1{left:350px;top:500px}
.b2{left:1450px;top:430px}
.b3{left:1650px;top:1100px}
.b4{left:500px;top:1250px}
.b5{left:1850px;top:650px}

/* Trees */

.tree{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:#245b2b;
    border:8px solid #17451e;
}

.tree:after{
    content:"";
    position:absolute;
    width:15px;
    height:45px;
    background:#704522;
    left:12px;
    top:40px;
}

.t1{left:180px;top:450px}
.t2{left:750px;top:250px}
.t3{left:1200px;top:200px}
.t4{left:1500px;top:800px}
.t5{left:850px;top:1100px}
.t6{left:2000px;top:1000px}
.t7{left:300px;top:1450px}
.t8{left:2100px;top:300px}

/* PLAYER */

#player{
    position:absolute;
    width:45px;
    height:65px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:20;
}

.playerBody{
    position:absolute;
    width:38px;
    height:45px;
    left:3px;
    top:20px;
    background:#1976d2;
    border-radius:12px;
}

.playerHead{
    position:absolute;
    width:28px;
    height:28px;
    left:8px;
    top:0;
    border-radius:50%;
    background:#d69a68;
    border:2px solid #222;
}

.gun{
    position:absolute;
    width:48px;
    height:9px;
    background:#222;
    left:25px;
    top:31px;
    transform-origin:left center;
    border-radius:4px;
}

/* ENEMY */

.enemy{
    position:absolute;
    width:43px;
    height:63px;
    z-index:15;
}

.enemyBody{
    position:absolute;
    width:37px;
    height:42px;
    left:3px;
    top:20px;
    background:#c62828;
    border-radius:11px;
}

.enemyHead{
    position:absolute;
    width:27px;
    height:27px;
    left:8px;
    top:0;
    border-radius:50%;
    background:#c88d60;
    border:2px solid #222;
}

.enemyGun{
    position:absolute;
    width:42px;
    height:8px;
    left:25px;
    top:31px;
    background:#111;
    border-radius:4px;
}

/* BULLET */

.bullet{
    position:absolute;
    width:12px;
    height:5px;
    background:#ffe600;
    border-radius:5px;
    box-shadow:0 0 12px yellow;
    z-index:30;
}

/* LOOT */

.loot{
    position:absolute;
    width:30px;
    height:30px;
    background:#e5b72e;
    border:3px solid #fff;
    transform:rotate(45deg);
    z-index:10;
}

.loot span{
    display:block;
    transform:rotate(-45deg);
    text-align:center;
    margin-top:5px;
}

/* SAFE ZONE */

#safeZone{
    position:absolute;
    width:1700px;
    height:1700px;
    border:8px solid #42a5f5;
    border-radius:50%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:5;
    box-shadow:0 0 30px rgba(0,150,255,.5);
}

/* DARK OUTSIDE ZONE */

#zoneOverlay{
    position:absolute;
    inset:0;
    background:rgba(30,0,60,.22);
    pointer-events:none;
    z-index:4;
}

/* HUD */

#hud{
    position:absolute;
    left:15px;
    top:15px;
    z-index:100;
    color:#fff;
    font-weight:bold;
    text-shadow:2px 2px 3px #000;
}

#healthBox{
    width:210px;
    height:20px;
    margin-top:7px;
    border:2px solid #fff;
    background:#333;
}

#health{
    width:100%;
    height:100%;
    background:#19d35b;
}

#ammo{
    margin-top:8px;
    font-size:20px;
}

#score{
    margin-top:5px;
}

/* CROSSHAIR */

#crosshair{
    position:absolute;
    width:30px;
    height:30px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:80;
    pointer-events:none;
}

#crosshair:before,
#crosshair:after{
    content:"";
    position:absolute;
    background:#fff;
    box-shadow:0 0 3px #000;
}

#crosshair:before{
    width:30px;
    height:2px;
    top:14px;
}

#crosshair:after{
    width:2px;
    height:30px;
    left:14px;
}

/* MOBILE CONTROLS */

#mobileControls{
    position:absolute;
    inset:0;
    z-index:150;
    pointer-events:none;
}

.joystick{
    position:absolute;
    left:25px;
    bottom:30px;
    width:120px;
    height:120px;
    border:3px solid rgba(255,255,255,.45);
    border-radius:50%;
    pointer-events:auto;
    background:rgba(0,0,0,.2);
}

.stick{
    position:absolute;
    width:55px;
    height:55px;
    left:30px;
    top:30px;
    border-radius:50%;
    background:rgba(255,255,255,.5);
}

.actionButtons{
    position:absolute;
    right:25px;
    bottom:25px;
    display:flex;
    gap:15px;
    pointer-events:auto;
}

.action{
    width:75px;
    height:75px;
    border-radius:50%;
    border:3px solid #fff;
    background:rgba(0,0,0,.5);
    color:white;
    font-size:30px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.fire{
    background:rgba(190,30,30,.75);
}

.punch{
    background:rgba(30,80,180,.75);
}

/* START */

#startScreen,
#gameOver{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.9);
    z-index:300;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
}

#startScreen h1{
    font-size:45px;
    color:#ff3333;
    text-shadow:0 0 15px red;
}

#startScreen p{
    margin-top:10px;
    color:#ddd;
}

.mainButton{
    margin-top:25px;
    padding:15px 45px;
    font-size:20px;
    font-weight:bold;
    color:white;
    background:#e53935;
    border:0;
    border-radius:10px;
}

#gameOver{
    display:none;
}

#gameOver h2{
    color:#ff3333;
    font-size:50px;
}

/* RESPONSIVE */

@media(max-width:600px){

    #startScreen h1{
        font-size:32px;
    }

    #hud{
        font-size:14px;
    }

    #healthBox{
        width:150px;
    }

    .joystick{
        width:105px;
        height:105px;
    }

    .stick{
        width:48px;
        height:48px;
        left:26px;
        top:26px;
    }

    .action{
        width:65px;
        height:65px;
        font-size:25px;
    }
}
</style>
</head>

<body>

<div id="game">

    <div id="world">

        <div class="road road1"></div>
        <div class="road road2"></div>
        <div class="road road3"></div>

        <div class="building b1"></div>
        <div class="building b2"></div>
        <div class="building b3"></div>
        <div class="building b4"></div>
        <div class="building b5"></div>

        <div class="tree t1"></div>
        <div class="tree t2"></div>
        <div class="tree t3"></div>
        <div class="tree t4"></div>
        <div class="tree t5"></div>
        <div class="tree t6"></div>
        <div class="tree t7"></div>
        <div class="tree t8"></div>

    </div>

    <div id="safeZone"></div>
    <div id="zoneOverlay"></div>

    <div id="player">
        <div class="playerHead"></div>
        <div class="playerBody"></div>
        <div class="gun"></div>
    </div>

    <div id="crosshair"></div>

    <div id="hud">

        ❤️ Health

        <div id="healthBox">
            <div id="health"></div>
        </div>

        <div id="ammo">
            🔫 Ammo: <span id="ammoText">60</span>
        </div>

        <div id="score">
            🏆 Score: <span id="scoreText">0</span>
        </div>

        <div>
            👾 Enemies: <span id="enemyText">0</span>
        </div>

    </div>

    <div id="mobileControls">

        <div class="joystick" id="joystick">
            <div class="stick" id="stick"></div>
        </div>

        <div class="actionButtons">

            <div class="action punch" id="punchButton">
                👊
            </div>

            <div class="action fire" id="fireButton">
                🔫
            </div>

        </div>

    </div>

    <div id="startScreen">

        <h1>🔥 BATTLE ZONE 🔥</h1>

        <p>🎯 Shoot enemy bots</p>
        <p>👊 Punch enemies when they get close</p>
        <p>🔵 Stay inside the Safe Zone</p>
        <p>🎒 Collect ammo boxes</p>

        <p>
            💻 WASD / Arrow Keys = Move<br>
            🖱️ Mouse = Aim<br>
            🔫 Left Click / Space = Shoot<br>
            👊 F = Punch
        </p>

        <button class="mainButton" id="startButton">
            START GAME
        </button>

    </div>

    <div id="gameOver">

        <h2>GAME OVER</h2>

        <p>
            Your Score:
            <strong id="finalScore">0</strong>
        </p>

        <button class="mainButton" id="restartButton">
            PLAY AGAIN
        </button>

    </div>

</div>


<script>

/* =========================
   GAME VARIABLES
========================= */

const game = document.getElementById("game");
const world = document.getElementById("world");
const player = document.getElementById("player");
const healthBar = document.getElementById("health");

const ammoText = document.getElementById("ammoText");
const scoreText = document.getElementById("scoreText");
const enemyText = document.getElementById("enemyText");

let running = false;

let playerX = 1200;
let playerY = 900;

let health = 100;
let ammo = 60;
let score = 0;

let enemies = [];
let bullets = [];
let loots = [];

let keys = {};

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;

let lastShot = 0;

let safeRadius = 850;
let zoneDamageTimer = 0;


/* =========================
   START
========================= */

document.getElementById("startButton")
.addEventListener("click",startGame);

document.getElementById("restartButton")
.addEventListener("click",startGame);


function startGame(){

    document.getElementById("startScreen").style.display="none";
    document.getElementById("gameOver").style.display="none";

    running=true;

    playerX=1200;
    playerY=900;

    health=100;
    ammo=60;
    score=0;

    safeRadius=850;

    enemies.forEach(e=>e.element.remove());
    bullets.forEach(b=>b.element.remove());
    loots.forEach(l=>l.element.remove());

    enemies=[];
    bullets=[];
    loots=[];

    updateHUD();

    spawnLoot();
    spawnLoot();
    spawnLoot();

    for(let i=0;i<8;i++){
        spawnEnemy();
    }

    requestAnimationFrame(gameLoop);
}


/* =========================
   INPUT
========================= */

document.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.code==="Space"){
        e.preventDefault();
        shoot();
    }

    if(e.key.toLowerCase()==="f"){
        punch();
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});


document.addEventListener("mousemove",e=>{
    mouseX=e.clientX;
    mouseY=e.clientY;
});


document.addEventListener("mousedown",e=>{
    if(e.button===0){
        shoot();
    }
});


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(){

    let speed=5;

    if(keys["w"] || keys["arrowup"])
        playerY-=speed;

    if(keys["s"] || keys["arrowdown"])
        playerY+=speed;

    if(keys["a"] || keys["arrowleft"])
        playerX-=speed;

    if(keys["d"] || keys["arrowright"])
        playerX+=speed;

    playerX=Math.max(30,Math.min(2370,playerX));
    playerY=Math.max(30,Math.min(1770,playerY));

    updateCamera();
}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    const centerX=window.innerWidth/2;
    const centerY=window.innerHeight/2;

    let worldLeft=centerX-playerX;
    let worldTop=centerY-playerY;

    world.style.left=worldLeft+"px";
    world.style.top=worldTop+"px";

    player.style.left=centerX+"px";
    player.style.top=centerY+"px";

    document.querySelectorAll(".enemy").forEach(enemy=>{
        // positions are updated by their world coordinates
    });

    enemies.forEach(enemy=>{
        enemy.element.style.left=
            (enemy.x+worldLeft)+"px";

        enemy.element.style.top=
            (enemy.y+worldTop)+"px";
    });

    loots.forEach(loot=>{
        loot.element.style.left=
            (loot.x+worldLeft)+"px";

        loot.element.style.top=
            (loot.y+worldTop)+"px";
    });

    bullets.forEach(bullet=>{
        bullet.element.style.left=
            (bullet.x+worldLeft)+"px";

        bullet.element.style.top=
            (bullet.y+worldTop)+"px";
    });
}


/* =========================
   AIM
========================= */

function updateAim(){

    const dx=mouseX-window.innerWidth/2;
    const dy=mouseY-window.innerHeight/2;

    const angle=Math.atan2(dy,dx)*180/Math.PI;

    document.querySelector(".gun").style.transform=
        `rotate(${angle}deg)`;
}


/* =========================
   SHOOT
========================= */

function shoot(){

    if(!running) return;

    const now=Date.now();

    if(now-lastShot<180) return;

    if(ammo<=0) return;

    lastShot=now;

    ammo--;

    updateHUD();

    const dx=mouseX-window.innerWidth/2;
    const dy=mouseY-window.innerHeight/2;

    const length=Math.sqrt(dx*dx+dy*dy);

    const vx=dx/length*13;
    const vy=dy/length*13;

    const bullet=document.createElement("div");

    bullet.className="bullet";

    game.appendChild(bullet);

    bullets.push({
        element:bullet,
        x:playerX,
        y:playerY,
        vx:vx,
        vy:vy,
        life:0
    });
}


/* =========================
   PUNCH
========================= */

function punch(){

    if(!running) return;

    enemies.forEach((enemy,index)=>{

        const dx=enemy.x-playerX;
        const dy=enemy.y-playerY;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<90){

            enemy.health-=50;

            if(enemy.health<=0){

                killEnemy(index);
            }
        }

    });
}


/* =========================
   SPAWN ENEMY
========================= */

function spawnEnemy(){

    const enemy=document.createElement("div");

    enemy.className="enemy";

    enemy.innerHTML=`
        <div class="enemyHead"></div>
        <div class="enemyBody"></div>
        <div class="enemyGun"></div>
    `;

    game.appendChild(enemy);

    let x;
    let y;

    do{
        x=100+Math.random()*2200;
        y=100+Math.random()*1600;
    }
    while(
        Math.abs(x-playerX)<400 &&
        Math.abs(y-playerY)<400
    );

    enemies.push({
        element:enemy,
        x:x,
        y:y,
        health:100,
        speed:1.2+Math.random()*0.8,
        attack:0
    });
}


/* =========================
   ENEMY AI
========================= */

function updateEnemies(){

    enemies.forEach((enemy,index)=>{

        const dx=playerX-enemy.x;
        const dy=playerY-enemy.y;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance>55){

            enemy.x+=(dx/distance)*enemy.speed;
            enemy.y+=(dy/distance)*enemy.speed;

        }else{

            enemy.attack++;

            if(enemy.attack>35){

                health-=4;

                enemy.attack=0;

                updateHUD();

                if(health<=0){

                    endGame();
                }
            }
        }

        const angle=Math.atan2(dy,dx);

        const gun=enemy.element.querySelector(".enemyGun");

        gun.style.transform=
            `rotate(${angle}rad)`;
    });
}


/* =========================
   BULLETS
========================= */

function updateBullets(){

    bullets.forEach((bullet,index)=>{

        bullet.x+=bullet.vx;
        bullet.y+=bullet.vy;

        bullet.life++;

        let hit=false;

        enemies.forEach((enemy,enemyIndex)=>{

            const dx=enemy.x-bullet.x;
            const dy=enemy.y-bullet.y;

            const distance=Math.sqrt(dx*dx+dy*dy);

            if(distance<30){

                enemy.health-=35;

                hit=true;

                createHit(
                    enemy.x,
                    enemy.y
                );

                if(enemy.health<=0){

                    killEnemy(enemyIndex);
                }
            }

        });

        if(
            hit ||
            bullet.life>100 ||
            bullet.x<0 ||
            bullet.y<0 ||
            bullet.x>2400 ||
            bullet.y>1800
        ){

            bullet.element.remove();

            bullets.splice(index,1);
        }
    });
}


/* =========================
   KILL ENEMY
========================= */

function killEnemy(index){

    const enemy=enemies[index];

    if(!enemy) return;

    enemy.element.remove();

    enemies.splice(index,1);

    score+=10;

    if(Math.random()<0.4){

        createLoot(enemy.x,enemy.y);
    }

    updateHUD();

    setTimeout(()=>{

        if(running){
            spawnEnemy();
        }

    },1200);
}


/* =========================
   LOOT
========================= */

function spawnLoot(){

    createLoot(
        200+Math.random()*2000,
        150+Math.random()*1450
    );
}


function createLoot(x,y){

    const loot=document.createElement("div");

    loot.className="loot";

    loot.innerHTML="<span>+</span>";

    game.appendChild(loot);

    loots.push({
        element:loot,
        x:x,
        y:y
    });
}


function collectLoot(){

    loots.forEach((loot,index)=>{

        const dx=loot.x-playerX;
        const dy=loot.y-playerY;

        const distance=Math.sqrt(dx*dx+dy*dy);

        if(distance<50){

            ammo+=20;

            health=Math.min(100,health+15);

            loot.element.remove();

            loots.splice(index,1);

            updateHUD();
        }

    });
}


/* =========================
   SAFE ZONE
========================= */

function updateSafeZone(){

    safeRadius-=0.025;

    if(safeRadius<300){
        safeRadius=300;
    }

    const distanceFromCenter=
        Math.sqrt(
            Math.pow(playerX-1200,2)+
            Math.pow(playerY-900,2)
        );

    if(distanceFromCenter>safeRadius){

        health-=0.08;

        updateHUD();

        if(health<=0){
            endGame();
        }
    }

    const size=safeRadius*2;

    const worldLeft=
        window.innerWidth/2-playerX;

    const worldTop=
        window.innerHeight/2-playerY;

    const zone=document.getElementById("safeZone");

    zone.style.width=size+"px";
    zone.style.height=size+"px";

    zone.style.left=
        (1200+worldLeft)+"px";

    zone.style.top=
        (900+worldTop)+"px";
}


/* =========================
   HIT EFFECT
========================= */

function createHit(x,y){

    const hit=document.createElement("div");

    hit.style.position="absolute";
    hit.style.width="25px";
    hit.style.height="25px";
    hit.style.borderRadius="50%";
    hit.style.border="3px solid white";
    hit.style.zIndex="200";

    game.appendChild(hit);

    const worldLeft=
        window.innerWidth/2-playerX;

    const worldTop=
        window.innerHeight/2-playerY;

    hit.style.left=
        (x+worldLeft)+"px";

    hit.style.top=
        (y+worldTop)+"px";

    setTimeout(()=>{
        hit.remove();
    },150);
}


/* =========================
   HUD
========================= */

function updateHUD(){

    healthBar.style.width=
        Math.max(0,health)+"%";

    ammoText.textContent=ammo;

    scoreText.textContent=score;

    enemyText.textContent=enemies.length;
}


/* =========================
   GAME OVER
========================= */

function endGame(){

    if(!running) return;

    running=false;

    document.getElementById("finalScore")
        .textContent=score;

    document.getElementById("gameOver")
        .style.display="flex";
}


/* =========================
   MAIN LOOP
========================= */

function gameLoop(){

    if(!running) return;

    movePlayer();

    updateAim();

    updateEnemies();

    updateBullets();

    collectLoot();

    updateSafeZone();

    updateCamera();

    updateHUD();

    requestAnimationFrame(gameLoop);
}


/* =========================
   MOBILE JOYSTICK
========================= */

const joystick=
    document.getElementById("joystick");

const stick=
    document.getElementById("stick");

let joystickActive=false;

joystick.addEventListener("pointerdown",e=>{
    joystickActive=true;
    joystick.setPointerCapture(e.pointerId);
});

joystick.addEventListener("pointermove",e=>{

    if(!joystickActive) return;

    const rect=joystick.getBoundingClientRect();

    const centerX=
        rect.left+rect.width/2;

    const centerY=
        rect.top+rect.height/2;

    let dx=e.clientX-centerX;
    let dy=e.clientY-centerY;

    const max=42;

    const distance=
        Math.sqrt(dx*dx+dy*dy);

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;
    }

    stick.style.left=
        (30+dx)+"px";

    stick.style.top=
        (30+dy)+"px";

    if(Math.abs(dx)>10){

        if(dx<0){
            playerX-=4;
        }else{
            playerX+=4;
        }
    }

    if(Math.abs(dy)>10){

        if(dy<0){
            playerY-=4;
        }else{
            playerY+=4;
        }
    }

});

joystick.addEventListener("pointerup",()=>{

    joystickActive=false;

    stick.style.left="30px";
    stick.style.top="30px";
});


/* MOBILE FIRE */

document.getElementById("fireButton")
.addEventListener("pointerdown",e=>{
    e.preventDefault();

    mouseX=window.innerWidth;
    mouseY=window.innerHeight/2;

    shoot();
});


/* MOBILE PUNCH */

document.getElementById("punchButton")
.addEventListener("pointerdown",e=>{
    e.preventDefault();
    punch();
});


/* RESIZE */

window.addEventListener("resize",()=>{
    updateCamera();
});
